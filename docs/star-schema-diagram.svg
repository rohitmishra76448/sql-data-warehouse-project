<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Star schema: fact_sales connected to dim_customers and dim_products</title>
<desc>A star schema with gold.fact_sales as the central fact table, joined to gold.dim_customers and gold.dim_products dimension tables via customer_key and product_key.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="800" height="420" fill="#ffffff"/>

<!-- Fact table (center) -->
<rect x="300" y="160" width="200" height="110" rx="8" fill="#85B7EB" stroke="#185FA5" stroke-width="1.2"/>
<text x="400" y="188" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#042C53">gold.fact_sales</text>
<line x1="315" y1="198" x2="485" y2="198" stroke="#185FA5" stroke-width="0.5"/>
<text x="320" y="216" font-family="Arial" font-size="11" fill="#042C53">order_date</text>
<text x="320" y="232" font-family="Arial" font-size="11" fill="#042C53">sales_amount</text>
<text x="320" y="248" font-family="Arial" font-size="11" fill="#042C53">quantity, price</text>

<!-- dim_customers (left) -->
<rect x="40" y="40" width="200" height="90" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="140" y="66" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#042C53">gold.dim_customers</text>
<text x="140" y="86" text-anchor="middle" font-family="Arial" font-size="11" fill="#042C53">customer_key</text>
<text x="140" y="102" text-anchor="middle" font-family="Arial" font-size="11" fill="#042C53">CRM + ERP profile data</text>

<!-- dim_products (right) -->
<rect x="560" y="40" width="200" height="90" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="660" y="66" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#042C53">gold.dim_products</text>
<text x="660" y="86" text-anchor="middle" font-family="Arial" font-size="11" fill="#042C53">product_key</text>
<text x="660" y="102" text-anchor="middle" font-family="Arial" font-size="11" fill="#042C53">Catalog + category</text>

<!-- connectors -->
<line x1="240" y1="110" x2="330" y2="165" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow2)"/>
<line x1="560" y1="110" x2="470" y2="165" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow2)"/>

<text x="270" y="130" font-family="Arial" font-size="11" fill="#5F5E5A">customer_key</text>
<text x="480" y="130" font-family="Arial" font-size="11" fill="#5F5E5A">product_key</text>

<text x="400" y="320" text-anchor="middle" font-family="Arial" font-size="12" fill="#5F5E5A">Fact table at the center, dimension tables joined on their surrogate keys</text>
</svg>
