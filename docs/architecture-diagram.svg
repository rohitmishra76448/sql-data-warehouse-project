<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Medallion architecture: source systems to bronze, silver, gold layers</title>
<desc>CRM and ERP source systems flow into a bronze raw layer, then a silver cleaned layer, then a gold analytics-ready layer containing dim_customers, dim_products, and fact_sales.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="900" height="420" fill="#ffffff"/>

<!-- Source systems -->
<rect x="30" y="150" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="95" y="173" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#2C2C2A">CRM System</text>
<text x="95" y="191" text-anchor="middle" font-family="Arial" font-size="11" fill="#5F5E5A">3 source tables</text>

<rect x="30" y="230" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="95" y="253" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#2C2C2A">ERP System</text>
<text x="95" y="271" text-anchor="middle" font-family="Arial" font-size="11" fill="#5F5E5A">3 source tables</text>

<!-- Bronze -->
<rect x="220" y="190" width="150" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="295" y="215" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#412402">Bronze layer</text>
<text x="295" y="233" text-anchor="middle" font-family="Arial" font-size="11" fill="#854F0B">Raw, no transforms</text>

<!-- Silver -->
<rect x="430" y="190" width="150" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="505" y="215" text-anchor="middle" font-family="Arial" font-size="14" font-weight="600" fill="#04342C">Silver layer</text>
<text x="505" y="233" text-anchor="middle" font-family="Arial" font-size="11" fill="#0F6E56">Cleaned, standardized</text>

<!-- Gold container -->
<rect x="640" y="70" width="230" height="280" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="660" y="98" font-family="Arial" font-size="14" font-weight="600" fill="#042C53">Gold layer</text>
<text x="660" y="116" font-family="Arial" font-size="11" fill="#185FA5">Star schema, analytics-ready</text>

<rect x="660" y="135" width="190" height="46" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="755" y="163" text-anchor="middle" font-family="Arial" font-size="12" font-weight="600" fill="#042C53">gold.dim_customers</text>

<rect x="660" y="195" width="190" height="46" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="755" y="223" text-anchor="middle" font-family="Arial" font-size="12" font-weight="600" fill="#042C53">gold.dim_products</text>

<rect x="660" y="255" width="190" height="46" rx="6" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
<text x="755" y="283" text-anchor="middle" font-family="Arial" font-size="12" font-weight="600" fill="#042C53">gold.fact_sales</text>

<!-- arrows -->
<line x1="160" y1="178" x2="220" y2="212" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="160" y1="258" x2="220" y2="228" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="370" y1="220" x2="430" y2="220" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="580" y1="220" x2="640" y2="220" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#arrow)"/>

<text x="295" y="370" text-anchor="middle" font-family="Arial" font-size="11" fill="#5F5E5A">bronze.crm_* / bronze.erp_*</text>
<text x="505" y="370" text-anchor="middle" font-family="Arial" font-size="11" fill="#5F5E5A">silver.crm_* / silver.erp_*</text>
</svg>
